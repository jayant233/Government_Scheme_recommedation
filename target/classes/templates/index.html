<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Scheme Recommendation System</title>
    <!-- Thymeleaf style loading from static folder -->
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

    <div class="container">
        <h1 id="pageTitle">Government Scheme Recommendation System</h1>
        <p class="subtitle">Enter your personal details below to check scheme eligibility</p>

        <!-- Submit to the /results endpoint -->
        <form id="recommendationForm" th:action="@{/results}" method="GET">
            
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="age">Age (Years):</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="income">Annual Family Income (Rs.):</label>
                <input type="number" id="income" name="income" placeholder="Enter annual income" required>
            </div>

            <div class="form-group">
                <label for="occupation">Occupation:</label>
                <select id="occupation" name="occupation" required>
                    <option value="">Select Occupation</option>
                    <option th:each="o : ${occupations}" th:value="${o}" th:text="${o}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Social Category:</label>
                <select id="category" name="category" required>
                    <option value="">Select Category</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="state">State / UT:</label>
                <select id="state" name="state" required>
                    <option value="">Select State</option>
                    <option th:each="s : ${states}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="btn">Check Eligible Schemes</button>
        </form>

        <div class="nav-link">
            <a th:href="@{/admin}" id="adminLink">Go to Admin Portal</a>
        </div>
        
        <!-- Results Section -->
        <div th:if="${eligibleSchemes != null}" style="margin-top: 40px; border-top: 2px solid #ddd; padding-top: 20px;">
            <h2>Eligible Government Schemes</h2>
            
            <p th:if="${error}" th:text="${error}" style="color:red;"></p>
            
            <table class="styled-table" style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                <thead>
                    <tr style="background-color: #f2f2f2;">
                        <th style="padding: 10px; border: 1px solid #ddd;">Scheme Name</th>
                        <th style="padding: 10px; border: 1px solid #ddd;">Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="scheme : ${eligibleSchemes}">
                        <td th:text="${scheme.schemeName}" style="padding: 10px; border: 1px solid #ddd;"></td>
                        <td th:text="${scheme.description}" style="padding: 10px; border: 1px solid #ddd;"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(eligibleSchemes)}">
                        <td colspan="2" style="text-align:center; padding: 15px; border: 1px solid #ddd;">No eligible schemes found for the information provided.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>

</body>
</html>
